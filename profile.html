<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | GraphQL</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            GraphQL Profile
        </div>
        <button id="logout-btn">
            Logout
        </button>
    </header>

    <main class="container">
        <!-- Profile Header -->
        <section class="profile-header">
            <div class="avatar">
            </div>
            <div class="user-details">
                <h1 id="username">
                    Loading...
                </h1>
                <p>
                    User ID:
                    <span id="user-id">
                        -
                    </span>
                </p>
            </div>
        </section>

        <!-- Main Statistics Cards -->
        <section class="dashboard-cards">
            <article class="card">
                <h3>
                    Total XP
                </h3>
                <strong id="xp-value">
                    0
                </strong>
            </article>

            <article class="card">
                <h3>
                    Projects Completed
                </h3>
                <strong id="projects-value">
                    0
                </strong>
            </article>

            <article class="card">
                <h3>
                    Audit Ratio
                </h3>
                <strong id="audit-value">
                    0
                </strong>
            </article>

            <article class="card">
                <h3>
                    Current Level
                </h3>
                <strong id="level-value">
                    -
                </strong>
            </article>
        </section>

        <!-- Statistics Section -->
        <section class="panel">
            <h2>
                Statistics
            </h2>

            <div class="charts">
                <div class="chart-box">
                    <h3>
                        XP Progress
                    </h3>
                    <svg 
                        id="xp-chart"
                        viewBox="0 0 700 350"
                        preserveAspectRatio="xMidYMid meet">
                    </svg>
                </div>

                <div class="chart-box">
                    <h3>
                        Project Results
                    </h3>
                    <svg 
                        id="project-chart"
                        viewBox="0 0 700 350"
                        preserveAspectRatio="xMidYMid meet">
                    </svg>
                </div>
            </div>
        </section>

<!-- Grades Table -->
<section class="panel">
    <h2>
        Grades
    </h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Project</th>
                    <th>Grade</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="grades-table">
                <!-- Filled by profile.js -->
            </tbody>
        </table>
    </div>
</section>
    </main>

    <script src="js/graphql.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/charts.js"></script>
    
</body>
</html>
